<section id="hero" class="hero">
  <div class="hero-inner">

    <!-- Label + Heading + Subtitle -->
    <div class="hero-text-top">
      <h1 class="hero-heading">
        Van bescherming<br />
        naar verbinding
      </h1>
      <p class="hero-subtitle">
        Begeleiding in beweging
      </p>
    </div>

    <!-- Photo directly under the subtitle -->
    <div class="hero-photo-wrap">
      <img
        class="hero-photo"
        src="image_nature.webp"
        alt="Begeleiding in de natuur"
        loading="eager"
        fetchpriority="high"
      />
    </div>

    <!-- Body text + buttons below photo -->
    <div class="hero-text-bottom">
      <p class="hero-body">
        Voel je dat stress, spanning of terugkerende patronen je tegenhouden?
        Ik begeleid mensen om opnieuw beweging te ervaren in hun lichaam,
        in hun communicatie en in hun leven.
      </p>
      <div class="hero-actions">
        <button class="hero-btn-primary" (click)="goToAanbod()">
          Ontdek mijn aanbod
        </button>
        <a class="hero-btn-ghost" [href]="bookingUrl" target="_blank" rel="noopener">
          Boek een afspraak
        </a>
      </div>
    </div>

  </div>
.</section>
