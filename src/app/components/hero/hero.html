<section id="hero" class="hero">
  <!-- Left: text content -->
  <div class="hero-content">
    <div class="hero-inner">
      <p class="hero-tag">
        Therapie &middot; Coaching in de natuur &middot; Training
      </p>

      <h1 class="hero-heading">
        Hoe luister je<br />naar de natuur<br />en jezelf?
      </h1>

      <p class="hero-subtext">
        Begeleiding op maat voor mensen die opnieuw willen verbinden&nbsp;
        met zichzelf, met anderen en met de natuur om hen heen.
      </p>

      <div class="hero-actions">
        <a class="btn-primary" [href]="bookingUrl" target="_blank" rel="noopener">Boek een afspraak</a>
        <button class="btn-outline" (click)="scrollTo('wie')">Over mij</button>
      </div>
    </div>
  </div>

  <!-- Right: portrait image -->
  <div class="hero-image-wrap">
    <img src="me%20standin.png" alt="Talk2, therapie en coaching in de natuur" class="hero-img" />
    <div class="hero-img-overlay"></div>
  </div>
</section>
