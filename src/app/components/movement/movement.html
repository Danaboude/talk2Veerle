<section id="beweging" class="movement">
  <div class="movement-inner">

    <!-- Portrait video  left column -->
    <div appScrollAnimate animateFrom="left" class="movement-video-wrap">
      <app-video-player
        [src]="videoUrl"
        [poster]="videoPoster"
        [loop]="true"
        label="Video over beweging op 4 lagen"
      />
    </div>

    <!-- Editorial text  right column -->
    <div appScrollAnimate animateFrom="right" [animateDelay]="120" class="movement-text-col">
      <p class="movement-label">Beweging</p>
      <h2 class="movement-heading">
        Op vier<br />
        lagen
      </h2>
      <div class="movement-rule"></div>
      <p class="movement-body">
        Beweging gebeurt nooit op één vlak.
        Ze raakt tegelijk je lichaam, je innerlijke beleving,
        je relaties en de context waarin je leeft of werkt.
      </p>
    </div>

  </div>
</section>
