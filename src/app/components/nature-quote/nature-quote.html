<section id="voor-wie" class="nature-quote">
  <div class="nq-overlay"></div>

  <div class="nq-inner">
    <!-- Left: quote -->
    <div appScrollAnimate animateFrom="left" class="quote-block">
      <div class="quote-mark">&ldquo;</div>
      <blockquote class="quote-text">
        De natuur fluistert<br />wat wij vergeten zijn<br />te horen.
      </blockquote>
      <p class="quote-attr">TALK2</p>
    </div>

    <!-- Right: Voor Wie? -->
    <div appScrollAnimate animateFrom="right" [animateDelay]="150" class="voor-wie-block">
      <h2 class="voor-wie-title">VOOR WIE?</h2>
      <div class="voor-wie-items">
        <p>Mensen die vastlopen en opnieuw richting willen vinden.</p>
        <p>Professionals die balans zoeken tussen werk en welzijn.</p>
        <p>Teams die anders willen communiceren en samenwerken.</p>
        <p>Iedereen aangetrokken tot natuur als leeromgeving.</p>
      </div>

    </div>
  </div>
</section>
