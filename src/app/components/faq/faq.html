<section id="faq" class="faq">
  <div class="faq-inner">

    <div class="faq-header">
      <p class="faq-label">Vragen</p>
      <h2 class="faq-title">Veelgestelde vragen</h2>
    </div>

    <div class="faq-list">
      @for (item of items; track item.question; let i = $index) {
      <div class="faq-item" [class.open]="openIndex() === i">
        <button
          class="faq-question"
          (click)="toggle(i)"
          [attr.aria-expanded]="openIndex() === i"
          [attr.aria-controls]="'faq-answer-' + i"
        >
          <span>{{ item.question }}</span>
          <span class="faq-chevron" [class.open]="openIndex() === i">⌄</span>
        </button>
        @if (openIndex() === i) {
        <div class="faq-answer" [id]="'faq-answer-' + i">
          <p>{{ item.question === 'Hoeveel kost een sessie?' ? pricingAnswer() : item.answer }}</p>
        </div>
        }
      </div>
      }
    </div>

  </div>
</section>
