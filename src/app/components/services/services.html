<section id="aanbod" class="services">
  <div class="services-container">

    <div appScrollAnimate class="services-header">
      <h2 class="section-title">AANBOD</h2>
    </div>

    <!-- Taste: no 3-equal-column cards — featured first card + 2-col below -->
    <div class="services-grid">
      @for (service of services; track service.number; let i = $index) {
        <div
          appScrollAnimate
          [animateDelay]="i * 100"
          class="service-card"
          [class.service-card--featured]="i === 0"
        >
          <div class="service-img-wrap">
            <img [src]="service.image" [alt]="service.imageAlt" class="service-img" />
          </div>

          <div class="service-body">
            <div class="service-number">{{ service.number }}</div>
            <h3 class="service-title">{{ service.title }}</h3>
            <div class="service-divider"></div>
            <p class="service-description">{{ service.description }}</p>
            <button class="service-cta" (click)="scrollToContact()">Meer info →</button>
          </div>
        </div>
      }
    </div>

  </div>
</section>
