<div class="creator-root">

  <!-- ══ NAV ══ -->
  <nav class="creator-nav">
    <div class="nav-inner">
      <div class="nav-brand">
        <img src="/logo.png" alt="Talk2" class="nav-logo" />
        <span class="nav-divider" aria-hidden="true"></span>
        <span class="nav-title">Campagne Builder</span>
      </div>
      <div class="nav-actions">
        <button class="btn-ghost" (click)="goToDashboard()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
          Dashboard
        </button>
        <button class="btn-primary" (click)="save()" [disabled]="saving()">
          @if (saving()) {
            <span class="spinner"></span> Opslaan...
          } @else {
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
              <polyline points="17 21 17 13 7 13 7 21"/>
              <polyline points="7 3 7 8 15 8"/>
            </svg>
            {{ savedId() ? 'Wijzigingen opslaan' : 'Publiceren' }}
          }
        </button>
      </div>
    </div>
  </nav>

  <!-- ══ GEPUBLICEERD BANNER ══ -->
  @if (savedId()) {
    <div class="success-banner">
      <div class="success-inner">
        <div class="success-check">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <div>
          <p class="success-title">Campagne gepubliceerd</p>
          <p class="success-url">{{ sharableUrl }}</p>
        </div>
        <button class="btn-copy" (click)="copyLink()">Link kopiëren</button>
      </div>
    </div>
  }

  <div class="creator-body">

    <!-- ══ LINKER PANEEL ══ -->
    <aside class="creator-sidebar">
      <div class="sidebar-scroll">

        <app-campagne-section
          [title]="title()"
          [brochureUrl]="brochureUrl()"
          [brochureDisplayName]="getBrochureDisplayName()"
          (titleChange)="title.set($event)"
          (brochureUploaded)="onBrochureFromSection($event)"
        />

        <app-hero-section
          [heroHeadline]="heroHeadline()"
          [heroSubtext]="heroSubtext()"
          [ctaText]="ctaText()"
          (heroHeadlineChange)="heroHeadline.set($event)"
          (heroSubtextChange)="heroSubtext.set($event)"
          (ctaTextChange)="ctaText.set($event)"
        />

        <app-bonus-section
          [bonusTitle]="bonusTitle()"
          [bonus1Label]="bonus1Label()"
          [bonus1Text]="bonus1Text()"
          [bonus2Label]="bonus2Label()"
          [bonus2Text]="bonus2Text()"
          [bonus3Label]="bonus3Label()"
          [bonus3Text]="bonus3Text()"
          (bonusTitleChange)="bonusTitle.set($event)"
          (bonus1LabelChange)="bonus1Label.set($event)"
          (bonus1TextChange)="bonus1Text.set($event)"
          (bonus2LabelChange)="bonus2Label.set($event)"
          (bonus2TextChange)="bonus2Text.set($event)"
          (bonus3LabelChange)="bonus3Label.set($event)"
          (bonus3TextChange)="bonus3Text.set($event)"
        />

        <app-automation-section
          [sequenceB]="automationSequenceB()"
          [sequenceC]="automationSequenceC()"
          [emailTypes]="emailTypes()"
          (sequenceBChange)="automationSequenceB.set($event)"
          (sequenceCChange)="automationSequenceC.set($event)"
        />

        <app-questions-section
          [questions]="questions()"
          (questionsChange)="questions.set($event)"
        />

        <app-testimonials-section
          [testimonials]="testimonials()"
          (testimonialsChange)="testimonials.set($event)"
        />

        <app-video-section
          [videoUrl]="videoUrl()"
          (videoUrlChange)="videoUrl.set($event)"
        />

      </div>
    </aside>

    <!-- ══ RECHTER PREVIEW PANEEL ══ -->
    <app-creator-preview
      [heroHeadline]="heroHeadline()"
      [heroSubtext]="heroSubtext()"
      [ctaText]="ctaText()"
      [heroImagePreview]="heroImagePreview()"
      [bonusTitle]="bonusTitle()"
      [bonus1Label]="bonus1Label()"
      [bonus1Text]="bonus1Text()"
      [bonus2Label]="bonus2Label()"
      [bonus2Text]="bonus2Text()"
      [bonus3Label]="bonus3Label()"
      [bonus3Text]="bonus3Text()"
      [bonusCTALabel]="bonusCTALabel()"
      [questions]="questions()"
      [testimonials]="testimonials()"
      [sequenceB]="automationSequenceB()"
      [sequenceC]="automationSequenceC()"
      [emailTypes]="emailTypes()"
      [videoUrl]="videoUrl()"
    />

  </div>
</div>

<!-- SNACKBAR -->
@if (snackbarMessage()) {
  <div class="snackbar">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    {{ snackbarMessage() }}
  </div>
}
