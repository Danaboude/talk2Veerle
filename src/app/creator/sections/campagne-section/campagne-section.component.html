<section class="panel-section">
  <div class="panel-section-header">
    <span class="section-icon-wrap" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/>
      </svg>
    </span>
    <h3 class="section-title">Campagne</h3>
  </div>

  <div class="panel-section-body">
    <!-- Interne naam -->
    <div class="form-group">
      <label class="form-label">Interne naam</label>
      <input class="form-input" type="text"
        [ngModel]="title" (ngModelChange)="titleChange.emit($event)"
        placeholder="Bijv. Q3 Lead Campagne" />
    </div>

    <!-- Brochure upload -->
    <div class="form-group">
      <label class="form-label">Brochure (PDF)</label>
      <div class="brochure-upload-area" (click)="brochureInput.click()">
        @if (brochureUrl) {
          <div class="brochure-info">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            <span class="brochure-name">{{ brochureDisplayName }}</span>
          </div>
        } @else {
          <div class="upload-placeholder">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <polyline points="16 16 12 12 8 16"/>
              <line x1="12" y1="12" x2="12" y2="21"/>
              <path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/>
            </svg>
            <span>PDF uploaden (max 10 MB)</span>
          </div>
        }
      </div>
      <input #brochureInput type="file" accept="application/pdf"
        (change)="onBrochureUpload($event)" style="display:none">
      <p class="section-desc">Wordt automatisch naar de lead gemaild na invullen van het formulier.</p>
    </div>
  </div>
</section>
