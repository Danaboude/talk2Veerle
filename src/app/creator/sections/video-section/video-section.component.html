<section class="panel-section">
  <div class="panel-section-header">
    <span class="section-icon-wrap" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <polygon points="23 7 16 12 23 17 23 7"/>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
      </svg>
    </span>
    <h3 class="section-title">Video</h3>
  </div>

  <div class="panel-section-body">
    <div class="form-group">
      <label class="form-label">YouTube URL</label>
      <input class="form-input" type="url"
        [ngModel]="videoUrl" (ngModelChange)="videoUrlChange.emit($event)"
        placeholder="https://www.youtube.com/watch?v=..." />
    </div>

    @if (embedUrl) {
      <div class="video-thumb">
        <iframe [src]="embedUrl" frameborder="0" allowfullscreen class="video-thumb-iframe"></iframe>
      </div>
    }
  </div>
</section>
