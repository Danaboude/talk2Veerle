<section class="panel-section">
  <div class="panel-section-header">
    <span class="section-icon-wrap" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
      </svg>
    </span>
    <h3 class="section-title">Getuigenissen</h3>
  </div>

  <div class="panel-section-body">
    <p class="section-desc">Voeg klantgetuigenissen toe om vertrouwen op te bouwen bij de lead.</p>

    @for (t of testimonials; track t.id; let ti = $index) {
      <div class="testimonial-edit-card animated-in">
        <div class="testimonial-edit-header">
          <span class="testimonial-edit-num">Getuigenis {{ ti + 1 }}</span>
          <button class="btn-icon danger sm"
            (click)="removeTestimonial(t.id)"
            [disabled]="testimonials.length <= 1"
            title="Verwijder">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <div class="form-group">
          <label class="form-label-sm">Klant / Auteur</label>
          <input class="form-input form-input-sm"
            [value]="t.author"
            (input)="updateTestimonial(t.id, 'author', $any($event.target).value)"
            placeholder="Bijv. Reynaers Aluminium" />
        </div>

        <div class="form-group">
          <label class="form-label-sm">Getuigenis</label>
          <textarea class="form-input textarea-sm" rows="3"
            [value]="t.quote"
            (input)="updateTestimonial(t.id, 'quote', $any($event.target).value)"
            placeholder="Typ hier de quote van de klant..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label-sm">Sterren (1–5)</label>
          <div class="star-rating-input">
            <input type="range" min="1" max="5" [value]="t.stars"
              (input)="updateTestimonial(t.id, 'stars', +$any($event.target).value)" />
            <span class="star-count">{{ t.stars }} / 5</span>
          </div>
        </div>
      </div>
    }

    <button class="btn-add-dashed-sm" (click)="addTestimonial()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Getuigenis toevoegen
    </button>
  </div>
</section>
