<div class="survey-root" *ngIf="!loading(); else loadingTpl">

    <!-- ERROR STATE -->
    <div class="error-screen" *ngIf="error()">
        <div class="error-card">
            <div class="error-icon">
                <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <h2>Survey niet gevonden</h2>
            <p>{{ error() }}</p>
        </div>
    </div>

    <!-- THANK YOU STATE -->
    <app-survey-thankyou
        *ngIf="submitted() && !error()"
        [isBrochureDownloadDone]="isBrochureDownloadDone()"
        [embedUrl]="embedUrl()"
        [calendarSettings]="calendarSettings()"
        [availableDates]="availableDates()"
        [availableTimes]="availableTimes()"
        [loadingTimes]="loadingTimes()"
        [selectedDate]="selectedDate()"
        [formattedSelectedDate]="formattedSelectedDate()"
        [selectedTime]="selectedTime()"
        [bookingStatus]="bookingStatus()"
        [minDateString]="minDateString()"
        [maxDateString]="maxDateString()"
        [email]="email()"
        (dateSelect)="selectDate($event)"
        (timeSelect)="selectedTime.set($event)"
        (bookAppointmentClick)="bookAppointment()">
    </app-survey-thankyou>

    <!-- MAIN SURVEY -->
    <ng-container *ngIf="survey() as s">
        <ng-container *ngIf="!submitted() && !error()">

            <!-- ── HERO ── -->
            <app-survey-hero
                [heroHeadline]="s.heroHeadline"
                [heroSubtext]="s.heroSubtext"
                [ctaText]="s.ctaText"
                [heroImage]="s.heroImage"
                (ctaClick)="scrollToSurvey()">
            </app-survey-hero>

            <!-- ── SURVEY WIZARD ── -->
            <app-survey-wizard
                *ngIf="showIntro()"
                [survey]="survey()"
                [currentStep]="currentStep()"
                [submitting]="submitting()"
                [name]="name()"
                [email]="email()"
                [phone]="phone()"
                [phoneError]="phoneError"
                [canProceedToQuestions]="canProceedToQuestions"
                [answers]="answers()"
                [otherAnswers]="otherAnswers()"
                (nameChange)="name.set($event)"
                (emailChange)="email.set($event)"
                (phoneChange)="phone.set($event)"
                (submitLeadClick)="submitLead()"
                (nextStepClick)="nextStep()"
                (prevStepClick)="prevStep()"
                (answerAndNextSelect)="selectAnswerAndNext($event.questionId, $event.answerId, $event.isLast)"
                (otherAnswerSubmit)="submitOtherAnswer($event)"
                (otherAnswerUpdate)="updateOtherAnswer($event.questionId, $event.text)"
                (meetingPreferenceSelect)="selectMeetingPreference($event)">
            </app-survey-wizard>

            <!-- ── TESTIMONIALS ── -->
            <app-survey-testimonials [testimonials]="s.testimonials || []" />

            <!-- ── FOOTER ── -->
            <footer class="survey-footer">
                <img src="/logo.png" class="footer-logo" alt="Talk2" />
                <span class="footer-text">© 2026 Talk2 | Ives De Saeger</span>
            </footer>

        </ng-container>
    </ng-container>
</div>

<ng-template #loadingTpl>
    <div class="loading-screen">
        <img src="/logo.png" class="loading-logo-img" alt="Talk2" />
        <div class="loading-spinner"></div>
    </div>
</ng-template>
