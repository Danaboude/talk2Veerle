<div class="dashboard-root">

    <!-- NAV -->
    <nav class="dash-nav">
        <div class="dash-nav-inner">
            <div class="dash-brand">
                <img src="/logo.png" class="dash-logo" alt="Talk2" />
                <span class="dash-title">Dashboard</span>
            </div>
            <a routerLink="/create" class="btn-new">
                <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
                </svg>
                Nieuwe survey
            </a>
        </div>
        <div class="dash-tabs">
            <button class="dash-tab" [class.active]="activeTab() === 'surveys'"        (click)="setTab('surveys')">Surveys</button>
            <button class="dash-tab" [class.active]="activeTab() === 'bookings'"       (click)="setTab('bookings')">Afspraken</button>
            <button class="dash-tab" [class.active]="activeTab() === 'email-templates'" (click)="setTab('email-templates')">E-mail Templates</button>
            <button class="dash-tab" [class.active]="activeTab() === 'offerings'"       (click)="setTab('offerings')">Aanbod</button>
            <button class="dash-tab" (click)="logout()" style="color: #dc2626;">Uitloggen</button>
        </div>
    </nav>

    <div class="dash-body">

        <!-- ══ SURVEYS TAB ══ -->
        @if (activeTab() === 'surveys') {
        <app-surveys-tab
            [surveys]="surveys()"
            [loading]="loading()"
            [selectedSurvey]="selectedSurvey()"
            [responses]="responses()"
            [responsesLoading]="responsesLoading()"
            [expandedResponse]="expandedResponse()"
            [sendingEmail]="sendingEmail()"
            [surveyStats]="surveyStats()"
            [questionStats]="questionStats()"
            [lowestEngagementQuestion]="lowestEngagementQuestion()"
            (surveySelected)="selectSurvey($event)"
            (surveyEdit)="editSurvey($event)"
            (surveyDelete)="deleteSurvey($event)"
            (responseExpand)="toggleResponseExpand($event)"
            (responseDelete)="deleteResponse($event.response, $event.event)"
            (reminderSend)="sendReminder($event)"
            (emailModalOpen)="openEmailModal($event)"
            (linkCopy)="copyLink($event)"
        />
        }

        <!-- ══ AFSPRAKEN TAB ══ -->
        @if (activeTab() === 'bookings') {
        <app-bookings-tab />
        }

        <!-- ══ E-MAIL TEMPLATES TAB ══ -->
        @if (activeTab() === 'email-templates') {
        <app-email-templates-tab
            [emailTemplates]="emailTemplates()"
            [emailTemplatesLoading]="emailTemplatesLoading()"
            (templateSave)="saveEmailTemplate($event)"
            (templateDelete)="deleteEmailTemplate($event)"
            (templateAdd)="addNewTemplate()"
        />
        }

        <!-- ══ AANBOD TAB ══ -->
        @if (activeTab() === 'offerings') {
        <app-offerings-tab
            [offerings]="offerings()"
            [offeringsLoading]="offeringsLoading()"
            (offeringSave)="saveOffering($event)"
            (offeringDelete)="deleteOffering($event)"
            (offeringAdd)="addNewOffering()"
        />
        }

    </div>
</div>

<!-- EMAIL COMPOSE MODAL -->
<div class="modal-overlay" *ngIf="showEmailModal()">
    <div class="modal-card">
        <div class="modal-header">
            <h3>Nieuwe E-mail → {{ emailTargetResponse()?.respondentName }}</h3>
            <button class="btn-close" (click)="closeEmailModal()">✕</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">Onderwerp</label>
                <input type="text" class="form-input"
                    [ngModel]="emailComposeSubject()" (ngModelChange)="emailComposeSubject.set($event)"
                    placeholder="Bijv. Vraag over je kwalificatie">
            </div>
            <div class="form-group mt-3">
                <label class="form-label">
                    Bericht
                    <span class="form-label-hint">(gebruik %FIRSTNAME% voor voornaam)</span>
                </label>
                <textarea class="form-input" rows="6"
                    [ngModel]="emailComposeBody()" (ngModelChange)="emailComposeBody.set($event)"
                    placeholder="Beste %FIRSTNAME%, ..."></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-ghost" (click)="closeEmailModal()">Annuleren</button>
            <button class="btn-primary" (click)="sendCustomEmail()"
                [disabled]="sendingEmail() || !emailComposeSubject() || !emailComposeBody()">
                {{ sendingEmail() ? 'Verzenden...' : 'Verstuur E-mail' }}
            </button>
        </div>
    </div>
</div>

<!-- SNACKBAR -->
@if (snackbarMessage()) {
<div class="snackbar">
    <svg class="snackbar-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    {{ snackbarMessage() }}
</div>
}
